<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c3f0"/>
      <stop offset="1" stop-color="#0a4f8f"/>
    </linearGradient>
  </defs>

  <!-- antenna -->
  <line x1="32" y1="6" x2="32" y2="13" stroke="#0b3c49" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="3.2" fill="#7a3cff"/>

  <!-- orbit ring (back half) -->
  <g transform="rotate(-20 32 35)">
    <path d="M3 35 A29 9 0 0 1 61 35" fill="none" stroke="#0b3c49" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- sphere -->
  <circle cx="32" cy="35" r="21" fill="url(#sphere)"/>

  <!-- visor + eyes -->
  <rect x="19" y="27" width="26" height="14" rx="7" fill="#06303a"/>
  <circle cx="27" cy="34" r="3" fill="#7ff6ff"/>
  <circle cx="37" cy="34" r="3" fill="#7ff6ff"/>

  <!-- orbit ring (front half) -->
  <g transform="rotate(-20 32 35)">
    <path d="M3 35 A29 9 0 0 0 61 35" fill="none" stroke="#0b3c49" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
